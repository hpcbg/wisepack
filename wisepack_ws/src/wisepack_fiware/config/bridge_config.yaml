# WISEPACK ROS 2 <-> FIWARE mapping — the single source of truth.
#
# Adapted from HARMONY's fiware_bridge/config/bridge_config.yaml. The structure
# is HARMONY's (fiware:, ros_to_fiware:, fiware_to_ros:) so its generator can be
# reused; the entities and topics are WISEPACK's.
#
# `generate_config.py` reads THIS file and emits `dds/context_broker_config.json`,
# the file Orion-LD reads when started with `-wip dds -mongocOnly`. There is no
# custom bridge node on this path: Orion-LD speaks DDS directly.
#
#     ROS 2 topic  /wisepack/action/event
#       -> DDS topic  rt/wisepack/action/event
#       -> NGSI-LD    urn:ngsi-ld:WISEPACKActionStream:main  .actionJson.value.data
#
# THREE CONSTRAINTS INHERITED FROM THE BRIDGE, each validated in HARMONY:
#
#   1. Only single-member scalar std_msgs bridge (String/Bool/Int32/Int64/
#      Float32/Float64). Custom messages are not representable, which is why
#      WISEPACK has no wisepack_interfaces package.
#   2. A topic whose final segment is exactly `status` is silently dropped
#      (it collides with ROS 2 actions' status/GoalStatusArray). Our plan-status
#      topic therefore uses the leaf `status_json`; the FIWARE attribute is still
#      called `status`, so NGSI consumers are unaffected.
#   3. Every value arrives nested: read `<attr>.value.data`, for strings and
#      numbers alike. A plain `"value": "APPROVE"` does NOT reach DDS — an
#      inbound PATCH must be `{"value": {"data": "APPROVE"}}`.
#
# ROS_DOMAIN_ID must equal the `domain` in the generated JSON (both default 0).

fiware:
  host: "localhost"
  port: 1026
  # The DDS Orion-LD broker runs -mongocOnly and is NGSI-LD only; no
  # Fiware-Service / Fiware-ServicePath headers are required or accepted.
  ngsi_ld: true

# --------------------------------------------------------------------------- #
# ROS 2 -> FIWARE  (WISEPACK publishes, Orion-LD reflects)
# --------------------------------------------------------------------------- #
ros_to_fiware:

  # ---- the audit trail --------------------------------------------------- #
  # THE core requirement. Every workflow action is published here first and is
  # then observable in FIWARE. There is no parallel direct-HTTP path.
  - ros_topic: "/wisepack/action/event"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKActionStream:main"
    fiware_entity_type: "WISEPACKActionStream"
    fiware_attribute: "actionJson"
    ros_field: "data"

  - ros_topic: "/wisepack/action/sequence"
    ros_msg_type: "std_msgs/Int32"
    fiware_entity: "WISEPACKActionStream:main"
    fiware_entity_type: "WISEPACKActionStream"
    fiware_attribute: "sequence"

  - ros_topic: "/wisepack/dynamic_event"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKActionStream:main"
    fiware_entity_type: "WISEPACKActionStream"
    fiware_attribute: "dynamicEvent"
    ros_field: "data"

  # ---- system and scenario ----------------------------------------------- #
  - ros_topic: "/wisepack/execution/state"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKSystem:main"
    fiware_entity_type: "WISEPACKSystem"
    fiware_attribute: "stage"
    ros_field: "data"

  - ros_topic: "/wisepack/system/readiness"
    ros_msg_type: "std_msgs/Bool"
    fiware_entity: "WISEPACKSystem:main"
    fiware_entity_type: "WISEPACKSystem"
    fiware_attribute: "readiness"

  # WHO EXECUTED. An audit trail that records a pick without recording whether a
  # seeded model or a physics engine produced it cannot support either claim.
  # JSON payload: {backend, label, detail, physical, isaac:{...}}.
  #
  # NOTE what is NOT bridged: /wisepack/isaac/{command,feedback}. Those are the
  # transport between the orchestrator and the simulator, and the audit-relevant
  # facts they carry — grasped, released, settled, failed, run completed — are
  # already published as ordinary ActionEvents with actor `isaac_sim` on
  # /wisepack/action/event. Mapping the raw channel as well would put the same
  # fact into the trail twice in two different shapes.
  - ros_topic: "/wisepack/execution/backend"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKSystem:main"
    fiware_entity_type: "WISEPACKSystem"
    fiware_attribute: "executionBackend"
    ros_field: "data"

  - ros_topic: "/wisepack/scenario/state"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKScenario:current"
    fiware_entity_type: "WISEPACKScenario"
    fiware_attribute: "summary"
    ros_field: "data"

  - ros_topic: "/wisepack/scenario/config"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKScenario:current"
    fiware_entity_type: "WISEPACKScenario"
    fiware_attribute: "config"
    ros_field: "data"

  - ros_topic: "/wisepack/waste/detected_count"
    ros_msg_type: "std_msgs/Int32"
    fiware_entity: "WISEPACKScenario:current"
    fiware_entity_type: "WISEPACKScenario"
    fiware_attribute: "detectedCount"

  # ---- plans -------------------------------------------------------------- #
  # The COMPACT DIGEST is mapped, not the full plans.
  #
  # /wisepack/plan/{baseline,optimized,selected} each carry a complete
  # PackingPlan (~27 kB for a 40-item scenario) because the dashboard's Digital
  # Twin needs real placement geometry. Pushing 27 kB into an NGSI-LD attribute
  # on every re-plan is not an audit trail worth having, and the audit value of
  # a plan is its container count, utilization and validity — all of which are
  # in the digest. The full geometry stays on DDS for the dashboard, and the
  # placement-level record is the results/wisepack-placements-*.csv artefact.
  - ros_topic: "/wisepack/plan/summary"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKPackingPlan:current"
    fiware_entity_type: "WISEPACKPackingPlan"
    fiware_attribute: "summary"
    ros_field: "data"

  # Strategy comparison — a COMPACT summary (~1-2 kB: per-strategy container
  # count, utilization, capacity, validity; NO placement geometry). FIWARE holds
  # the semantic result so analytics can read it back; the full comparison stays
  # on the ROS topic. This is state-oriented: the attribute holds the LATEST
  # comparison, not an append-only history.
  - ros_topic: "/wisepack/plan/strategy_comparison"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKPackingPlan:current"
    fiware_entity_type: "WISEPACKPackingPlan"
    fiware_attribute: "strategyComparison"
    ros_field: "data"

  # NOTE the `status_json` leaf — see constraint 2 in the header. The FIWARE
  # attribute is still `status`.
  - ros_topic: "/wisepack/plan/status_json"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKPackingPlan:current"
    fiware_entity_type: "WISEPACKPackingPlan"
    fiware_attribute: "status"
    ros_field: "data"

  # ---- anomaly monitoring & workflow response ---------------------------- #
  # Compact SIMULATED anomaly state. State-oriented: the attribute holds the
  # LATEST anomaly record, not an append-only history. Never a validated
  # detector; the source is always `simulated`.
  - ros_topic: "/wisepack/anomaly/event"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKAnomaly:main"
    fiware_entity_type: "WISEPACKAnomaly"
    fiware_attribute: "latest"
    ros_field: "data"

  - ros_topic: "/wisepack/anomaly/state"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKAnomaly:main"
    fiware_entity_type: "WISEPACKAnomaly"
    fiware_attribute: "state"
    ros_field: "data"

  # ---- robot -------------------------------------------------------------- #
  - ros_topic: "/wisepack/execution/current_item"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKRobot:arm-01"
    fiware_entity_type: "WISEPACKRobot"
    fiware_attribute: "currentItem"
    ros_field: "data"

  - ros_topic: "/wisepack/execution/current_container"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKRobot:arm-01"
    fiware_entity_type: "WISEPACKRobot"
    fiware_attribute: "currentContainer"
    ros_field: "data"

  - ros_topic: "/wisepack/execution/progress_pct"
    ros_msg_type: "std_msgs/Float32"
    fiware_entity: "WISEPACKRobot:arm-01"
    fiware_entity_type: "WISEPACKRobot"
    fiware_attribute: "progressPct"

  # ---- cutting (SIMULATED cut-aware planning) ----------------------------- #
  # Compact cut state for FIWARE — the recommended proposal, the skill state and
  # the actual result. SIMULATED cutting; the source in every payload is
  # `simulated`. Full segment geometry stays on ROS / in the result artefacts.
  - ros_topic: "/wisepack/cutting/proposal"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKCutting:main"
    fiware_entity_type: "WISEPACKCutting"
    fiware_attribute: "proposal"
    ros_field: "data"

  - ros_topic: "/wisepack/cutting/state"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKCutting:main"
    fiware_entity_type: "WISEPACKCutting"
    fiware_attribute: "state"
    ros_field: "data"

  - ros_topic: "/wisepack/cutting/result"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKCutting:main"
    fiware_entity_type: "WISEPACKCutting"
    fiware_attribute: "result"
    ros_field: "data"

  # ---- inventory (FIWARE as the shared semantic container inventory) ------- #
  # The DDS bridge maps one topic to one entity, so the aggregate inventory
  # travels as JSON: each element of `containers` self-identifies with its own
  # urn:ngsi-ld:WISEPACKContainer:<id> semantic id (see
  # inventory.InventoryContainer.semantic_state). Compact semantic state only —
  # NO placement geometry, which stays on ROS / the Digital Twin.
  - ros_topic: "/wisepack/inventory/container_state"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKInventory:main"
    fiware_entity_type: "WISEPACKInventory"
    fiware_attribute: "containers"
    ros_field: "data"

  - ros_topic: "/wisepack/inventory/summary"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKInventory:main"
    fiware_entity_type: "WISEPACKInventory"
    fiware_attribute: "summary"
    ros_field: "data"

  - ros_topic: "/wisepack/inventory/container_event"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKInventory:main"
    fiware_entity_type: "WISEPACKInventory"
    fiware_attribute: "lastEvent"
    ros_field: "data"

  - ros_topic: "/wisepack/inventory/reservation"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKInventory:main"
    fiware_entity_type: "WISEPACKInventory"
    fiware_attribute: "reservation"
    ros_field: "data"

  # ---- logistics (SIMULATED container transport) -------------------------- #
  - ros_topic: "/wisepack/logistics/container_task"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKLogistics:main"
    fiware_entity_type: "WISEPACKLogistics"
    fiware_attribute: "task"
    ros_field: "data"

  - ros_topic: "/wisepack/logistics/container_task_state"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKLogistics:main"
    fiware_entity_type: "WISEPACKLogistics"
    fiware_attribute: "taskState"
    ros_field: "data"

  - ros_topic: "/wisepack/logistics/mobile_robot_state"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKLogistics:main"
    fiware_entity_type: "WISEPACKLogistics"
    fiware_attribute: "mobileRobot"
    ros_field: "data"

  # ---- KPIs --------------------------------------------------------------- #
  - ros_topic: "/wisepack/kpi/containers_baseline"
    ros_msg_type: "std_msgs/Int32"
    fiware_entity: "WISEPACKKPI:current"
    fiware_entity_type: "WISEPACKKPI"
    fiware_attribute: "containersBaseline"

  - ros_topic: "/wisepack/kpi/containers_optimized"
    ros_msg_type: "std_msgs/Int32"
    fiware_entity: "WISEPACKKPI:current"
    fiware_entity_type: "WISEPACKKPI"
    fiware_attribute: "containersOptimized"

  - ros_topic: "/wisepack/kpi/utilization_baseline_pct"
    ros_msg_type: "std_msgs/Float32"
    fiware_entity: "WISEPACKKPI:current"
    fiware_entity_type: "WISEPACKKPI"
    fiware_attribute: "utilizationBaselinePct"

  - ros_topic: "/wisepack/kpi/utilization_optimized_pct"
    ros_msg_type: "std_msgs/Float32"
    fiware_entity: "WISEPACKKPI:current"
    fiware_entity_type: "WISEPACKKPI"
    fiware_attribute: "utilizationOptimizedPct"

  - ros_topic: "/wisepack/kpi/volume_reduction_pct"
    ros_msg_type: "std_msgs/Float32"
    fiware_entity: "WISEPACKKPI:current"
    fiware_entity_type: "WISEPACKKPI"
    fiware_attribute: "volumeReductionPct"

  - ros_topic: "/wisepack/kpi/optimization_ms"
    ros_msg_type: "std_msgs/Float32"
    fiware_entity: "WISEPACKKPI:current"
    fiware_entity_type: "WISEPACKKPI"
    fiware_attribute: "optimizationMs"

  - ros_topic: "/wisepack/kpi/pick_success_pct"
    ros_msg_type: "std_msgs/Float32"
    fiware_entity: "WISEPACKKPI:current"
    fiware_entity_type: "WISEPACKKPI"
    fiware_attribute: "pickSuccessPct"

  - ros_topic: "/wisepack/kpi/end_to_end_success_pct"
    ros_msg_type: "std_msgs/Float32"
    fiware_entity: "WISEPACKKPI:current"
    fiware_entity_type: "WISEPACKKPI"
    fiware_attribute: "endToEndSuccessPct"

  # ---- run correlation ---------------------------------------------------- #
  # WHICH RUN each projection above describes.
  #
  # Orion-LD holds CURRENT STATE, not a log: every attribute keeps its last
  # value across scenario changes, restarts and whole runs. `containersBaseline:
  # 1` written by isaac_cylinders_smoke is still there while mixed_pipes_dense
  # (3 baseline, 2 optimized) is running, and a consumer reading it back has no
  # way to tell. Neither an HTTP 200 nor the entity existing says anything about
  # freshness — so freshness travels IN the data.
  #
  # The orchestrator publishes each of these AFTER that entity's values. A
  # consumer polling mid-update then sees the OLD stamp with some new values and
  # withholds the entity; the opposite order would show the NEW stamp with some
  # OLD values and trust them. See wisepack_core/correlation.py.

  - ros_topic: "/wisepack/correlation/system"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKSystem:main"
    fiware_entity_type: "WISEPACKSystem"
    fiware_attribute: "runCorrelation"
    ros_field: "data"

  - ros_topic: "/wisepack/correlation/scenario"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKScenario:current"
    fiware_entity_type: "WISEPACKScenario"
    fiware_attribute: "runCorrelation"
    ros_field: "data"

  - ros_topic: "/wisepack/correlation/plan"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKPackingPlan:current"
    fiware_entity_type: "WISEPACKPackingPlan"
    fiware_attribute: "runCorrelation"
    ros_field: "data"

  - ros_topic: "/wisepack/correlation/kpi"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKKPI:current"
    fiware_entity_type: "WISEPACKKPI"
    fiware_attribute: "runCorrelation"
    ros_field: "data"

  - ros_topic: "/wisepack/correlation/robot"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKRobot:arm-01"
    fiware_entity_type: "WISEPACKRobot"
    fiware_attribute: "runCorrelation"
    ros_field: "data"

  - ros_topic: "/wisepack/correlation/actions"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKActionStream:main"
    fiware_entity_type: "WISEPACKActionStream"
    fiware_attribute: "runCorrelation"
    ros_field: "data"

  - ros_topic: "/wisepack/correlation/anomaly"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKAnomaly:main"
    fiware_entity_type: "WISEPACKAnomaly"
    fiware_attribute: "runCorrelation"
    ros_field: "data"

  - ros_topic: "/wisepack/correlation/inventory"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKInventory:main"
    fiware_entity_type: "WISEPACKInventory"
    fiware_attribute: "runCorrelation"
    ros_field: "data"

  - ros_topic: "/wisepack/correlation/cutting"
    ros_msg_type: "std_msgs/String"
    fiware_entity: "WISEPACKCutting:main"
    fiware_entity_type: "WISEPACKCutting"
    fiware_attribute: "runCorrelation"
    ros_field: "data"

# --------------------------------------------------------------------------- #
# FIWARE -> ROS 2  (an operator or external HMI drives the workflow)
# --------------------------------------------------------------------------- #
# A PATCH of one of these attributes republishes on the DDS topic, which the
# orchestrator is subscribed to. This is the documented command path: the
# bundled dashboard uses exactly the same route in live mode rather than
# mutating engine state in-process.
#
#   curl -X PATCH \
#     'http://localhost:1026/ngsi-ld/v1/entities/urn:ngsi-ld:WISEPACKSystem:main/attrs/approval' \
#     -H 'Content-Type: application/json' \
#     -d '{"type":"Property","value":{"data":"APPROVE"}}'
fiware_to_ros:
  - fiware_entity: "WISEPACKSystem:main"
    fiware_entity_type: "WISEPACKSystem"
    fiware_attribute: "approval"
    ros_topic: "/wisepack/operator/approval"
    ros_msg_type: "std_msgs/String"

  - fiware_entity: "WISEPACKSystem:main"
    fiware_entity_type: "WISEPACKSystem"
    fiware_attribute: "command"
    ros_topic: "/wisepack/operator/command"
    ros_msg_type: "std_msgs/String"

  # A SEPARATE cut approval channel — a PATCH here approves/rejects cutting only,
  # never the packing plan (brief §6).
  - fiware_entity: "WISEPACKSystem:main"
    fiware_entity_type: "WISEPACKSystem"
    fiware_attribute: "cutApproval"
    ros_topic: "/wisepack/cutting/approval"
    ros_msg_type: "std_msgs/String"

  # Inventory operator requests (reserve / deliver / collect ...), JSON command.
  - fiware_entity: "WISEPACKSystem:main"
    fiware_entity_type: "WISEPACKSystem"
    fiware_attribute: "inventoryRequest"
    ros_topic: "/wisepack/inventory/request"
    ros_msg_type: "std_msgs/String"
