# Small presentation scenario — fast to plan, easy to read on screen.
scenario:
  preset: mixed_pipes_small
  seed: 42
  strategy: max_density

generator:
  item_count: 16
  length_range_mm: [300, 1200]
  diameter_range_mm: [60, 200]
  container_spec: compact_box

optimizer:
  restarts: 6
  time_budget_ms: 2000

dynamic_events: []
